<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — Abhishek Ash</title>
<meta name="robots" content="noindex">

<style>
  :root {
    --bg: #F2EEE4;
    --ink: #1B1A15;
    --muted: #5B5A4F;
    --line: #D5CFC0;
    --accent: #8A4A12;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14130F; --ink: #F1ECE0; --muted: #A6A294; --line: #322F27; --accent: #FFBD69; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
  }
  main { width: min(560px, 100%); }
  .mark {
    display: grid;
    place-items: center;
    width: 34px;
    height: 34px;
    border: 1px solid var(--ink);
    border-radius: 3px;
    font: 600 11px/1 var(--mono);
    margin-bottom: 40px;
  }
  .kicker {
    font: 500 10.5px/1 var(--mono);
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 14px;
  }
  h1 {
    margin: 0;
    font-family: var(--serif);
    font-weight: 400;
    font-size: clamp(2.4rem, 8vw, 3.6rem);
    line-height: 1.02;
    letter-spacing: -.025em;
  }
  p {
    margin: 18px 0 0;
    max-width: 42ch;
    color: var(--muted);
    font-size: 16px;
    line-height: 1.65;
  }
  a {
    display: inline-block;
    margin-top: 30px;
    padding-bottom: 3px;
    color: var(--accent);
    font: 600 14px/1.4 var(--sans);
    text-decoration: none;
    border-bottom: 1px solid var(--accent);
  }
  a:hover { color: var(--ink); border-color: var(--ink); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <div class="mark" aria-hidden="true">AA</div>
  <p class="kicker">404 / Off the map</p>
  <h1>This path doesn't go anywhere.</h1>
  <p>The link may be old, or the page may have moved. The trail starts again at home.</p>
  <a href="/">Back to abhishekash.github.io →</a>
</main>
</body>
</html>
